version: 2

sources:
  - name: raw_data
    description: "Raw restaurant data from various APIs"
    tables:
      - name: raw_restaurant_data
        description: "Raw restaurant data from Yelp and Google Places APIs"
        columns:
          - name: id
            description: "Unique identifier for the restaurant"
            tests:
              - not_null
              - unique
          - name: name
            description: "Name of the restaurant"
            tests:
              - not_null
          - name: rating
            description: "Rating of the restaurant"
            tests:
              - not_null
              - accepted_range:
                  min_value: 0
                  max_value: 5
          - name: data_source
            description: "Source of the data (yelp or google_places)"
            tests:
              - not_null
              - accepted_values:
                  values: ['yelp', 'google_places']
          - name: ingestion_timestamp
            description: "Timestamp when the data was ingested"
            tests:
              - not_null
