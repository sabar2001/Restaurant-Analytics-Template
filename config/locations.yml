settings:
  default_yelp_limit: 500  # 10x increase for large-scale ingestion
  default_google_radius: 10000  # Expanded radius for more coverage  
  batch_size: 10  # Process more locations in parallel
  retry_attempts: 3
  cache_duration_hours: 24
  
  # Spark Configuration  
  use_spark: true  # ✅ ENABLED - Java 11 installed!
  spark_master: "local[*]"
  spark_app_name: "RestaurantAnalytics-BigData"
  spark_memory: "4g"  # Increased for large-scale processing
  spark_cores: 4
  spark_streaming_enabled: false
  
  # Streaming Configuration (when enabled)
  kafka_bootstrap_servers: "localhost:9092"
  kafka_topic: "restaurant_data"
  streaming_batch_interval: 30  # seconds
